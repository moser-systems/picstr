<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title th:text="#{label.photos}">Photo List</title>
</head>

<div layout:fragment="content">
    <div class="page-header mt-3">
        <div class="row align-items-center">
            <div class="col">
                <h2 class="page-title">
                    <span th:if="${filterType == 'category'}" th:text="#{label.photo.list.byCategory(${filterValue})}">Photos in category</span>
                    <span th:if="${filterType == 'tag'}" th:text="#{label.photo.list.byTag(${filterValue})}">Photos with tag</span>
                    <span th:if="${filterType != 'category' and filterType != 'tag'}" th:text="${listTitle} ?: #{label.photos}">Photos</span>
                </h2>
            </div>
            <div class="col-auto">
                <a href="/photos/upload" class="btn btn-primary" th:title="#{label.btn.upload}" hx-boost="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-upload">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                        <path d="M7 9l5 -5l5 5" />
                        <path d="M12 4l0 12" />
                    </svg>
                    <span th:text="#{label.btn.upload}"></span>
                </a>
            </div>
        </div>
    </div>

    <div class="page-body" th:fragment="photoCards(photos, emptyMessage)">
        <div class="alert alert-info" th:if="${#lists.isEmpty(photos)}">
            <span th:if="${filterType == 'category'}" th:text="#{msg.photo.list.empty.category}">No photos found for this category.</span>
            <span th:if="${filterType == 'tag'}" th:text="#{msg.photo.list.empty.tag}">No photos found for this tag.</span>
            <span th:if="${filterType != 'category' and filterType != 'tag'}" th:text="${emptyMessage}">No photos found.</span>
        </div>

        <div class="row row-cards" th:if="${!#lists.isEmpty(photos)}">
            <div class="col-sm-6 col-lg-4 col-xl-3" th:each="photo : ${photos}">
                <div class="card card-link card-link-pop">
                    <label class="position-absolute top-0 start-0 m-2 p-1 rounded bg-body bg-opacity-75" style="z-index: 2"
                           th:if="${categories != null}" th:title="#{label.bulk.select}">
                        <input type="checkbox" class="form-check-input m-0 bulk-select" name="ids" form="bulk-form"
                               th:value="${photo.id}" th:aria-label="|#{label.bulk.select}: ${photo.originalFilename}|">
                    </label>
                    <a th:href="@{|/photos/${photo.id}|}">
                        <div th:title="${photo.originalFilename}" class="card-img-top img-responsive img-responsive-1x1"
                             th:style="|background-image: url('/assets/${photo.thumbnailKey}')|">
                        </div>
                    </a>
                    <div class="card-body">
                        <a th:href="@{|/photos/by-category/${photo.category.name}|}" class="text-decoration-none">
                            <span th:class="|badge bg-${photo.category.color} text-${photo.category.color}-fg|" th:text="|${photo.category.name}|">category</span>
                        </a>
                        <div class="mt-2">
                            <div class="badge-list">
                                <span th:each="tag : ${photo.tags}">
                                    <a th:href="@{|/photos/by-tag/${tag.name}|}" class="text-decoration-none">
                                        <span th:class="|badge bg-${tag.color}-lt text-${tag.color}-lt-fg|" th:text="|#${tag.name}|">tag</span>
                                    </a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form id="bulk-form" class="card position-sticky bottom-0 mt-3 shadow d-none" style="z-index: 3"
              th:if="${categories != null and !#lists.isEmpty(photos)}"
              th:action="@{/photos/bulk}" method="post"
              th:attr="data-selected-text=#{label.bulk.selected},data-confirm-archive=#{msg.bulk.confirmArchive}">
            <input type="hidden" name="returnTo" th:value="${returnUrl}">
            <div class="card-body d-flex flex-wrap gap-2 align-items-center">
                <strong class="me-1 bulk-count">0</strong>
                <button type="button" class="btn btn-link px-1 bulk-select-all" th:text="#{label.bulk.selectAll}">Select all</button>
                <button type="button" class="btn btn-link px-1 bulk-clear" th:text="#{label.bulk.clear}">Clear</button>
                <button type="submit" name="action" value="archive" class="btn btn-outline-danger" th:text="#{label.bulk.archive}">Archive</button>
                <div class="input-group w-auto">
                    <select name="category" class="form-select" th:aria-label="#{label.category}">
                        <option value="" th:text="#{label.category.select}">Select category</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${#strings.capitalize(c.name)}"></option>
                    </select>
                    <button type="submit" name="action" value="category" class="btn btn-outline-primary" th:text="#{label.bulk.setCategory}">Set category</button>
                </div>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <div style="min-width: 14rem">
                        <select id="bulk-tags" name="tags" multiple autocomplete="off" th:aria-label="#{label.tags}">
                            <option th:each="t : ${allTags}" th:value="${t.name}" th:text="${t.name}"></option>
                        </select>
                    </div>
                    <button type="submit" name="action" value="addTags" class="btn btn-outline-primary" th:text="#{label.bulk.addTags}">Add tags</button>
                    <button type="submit" name="action" value="removeTags" class="btn btn-outline-secondary" th:text="#{label.bulk.removeTags}">Remove tags</button>
                </div>
            </div>
        </form>

        <div class="mt-3" th:if="${pageData != null and pageData.totalPages > 1}">
            <ul class="pagination m-0">
                <li class="page-item" th:classappend="${pageData.first} ? ' disabled'">
                    <a class="page-link" th:if="${!pageData.first}" th:href="@{|${pageBaseUrl}page=${pageData.number - 1}&size=${pageSize}|}">&laquo;</a>
                    <span class="page-link" th:if="${pageData.first}">&laquo;</span>
                </li>
                <li class="page-item"
                    th:each="pageNumber : ${#numbers.sequence(0, pageData.totalPages - 1)}"
                    th:classappend="${pageNumber == pageData.number} ? ' active'">
                    <a class="page-link" th:href="@{|${pageBaseUrl}page=${pageNumber}&size=${pageSize}|}" th:text="${pageNumber + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${pageData.last} ? ' disabled'">
                    <a class="page-link" th:if="${!pageData.last}" th:href="@{|${pageBaseUrl}page=${pageData.number + 1}&size=${pageSize}|}">&raquo;</a>
                    <span class="page-link" th:if="${pageData.last}">&raquo;</span>
                </li>
            </ul>
        </div>
    </div>
</div>
</html>
