<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title th:text="#{label.search.title}">Search</title>
</head>

<div layout:fragment="content">
    <div class="page-header mt-3">
        <h2 class="page-title" th:text="#{label.search.title}">Search</h2>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/photos/search}" th:object="${search}" method="get" hx-boost="true">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-4">
                        <label class="form-label" for="search-q" th:text="#{label.search.text}">Text</label>
                        <input id="search-q" type="search" class="form-control" th:field="*{q}"
                               th:placeholder="#{label.search.placeholder}">
                    </div>
                    <div class="col-6 col-lg-3">
                        <label class="form-label" for="search-category" th:text="#{label.category}">Category</label>
                        <select id="search-category" class="form-select" th:field="*{category}">
                            <option value="" th:text="#{label.search.anyCategory}">Any category</option>
                            <option th:each="c : ${categories}" th:value="${c.name}"
                                    th:text="${#strings.capitalize(c.name)}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="search-tag" th:text="#{label.tag}">Tag</label>
                        <select id="search-tag" class="form-select" th:field="*{tag}">
                            <option value="" th:text="#{label.search.anyTag}">Any tag</option>
                            <option th:each="t : ${allTags}" th:value="${t.name}" th:text="${t.name}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{located}">
                            <span class="form-check-label" th:text="#{label.search.located}">With location</span>
                        </label>
                    </div>
                    <div class="col-6 col-lg-1">
                        <button type="submit" class="btn btn-primary w-100" th:text="#{label.btn.search}">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${pageData != null}">
        <p class="text-secondary mt-3" th:text="#{label.search.results(${pageData.totalElements})}">3 photos found</p>
        <div th:replace="~{photo/list :: photoCards(${photos}, #{msg.photo.search.empty})}"></div>
    </div>
</div>
</html>
