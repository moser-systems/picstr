<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title th:text="#{label.search.title}">Search</title>
</head>

<div layout:fragment="content">
    <div class="page-header mt-3">
        <h2 class="page-title" th:text="#{label.search.title}">Search</h2>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <form id="search-form" th:action="@{/photos/search}" th:object="${search}" method="get" hx-boost="true">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-4">
                        <label class="form-label" for="search-q" th:text="#{label.search.text}">Text</label>
                        <input id="search-q" type="search" class="form-control" th:field="*{q}"
                               th:placeholder="#{label.search.placeholder}">
                    </div>
                    <div class="col-6 col-lg-3">
                        <label class="form-label" for="search-category" th:text="#{label.category}">Category</label>
                        <select id="search-category" class="form-select" th:field="*{category}">
                            <option value="" th:text="#{label.search.anyCategory}">Any category</option>
                            <option th:each="c : ${categories}" th:value="${c.name}"
                                    th:text="${#strings.capitalize(c.name)}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-label" for="search-tag" th:text="#{label.tag}">Tag</label>
                        <select id="search-tag" class="form-select" th:field="*{tag}">
                            <option value="" th:text="#{label.search.anyTag}">Any tag</option>
                            <option th:each="t : ${allTags}" th:value="${t.name}" th:text="${t.name}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2">
                        <label class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" th:field="*{located}">
                            <span class="form-check-label" th:text="#{label.search.located}">With location</span>
                        </label>
                    </div>
                    <div class="col-6 col-lg-1">
                        <button type="submit" class="btn btn-primary w-100" th:text="#{label.btn.search}">Search</button>
                    </div>
                </div>

                <input type="hidden" th:field="*{north}">
                <input type="hidden" th:field="*{south}">
                <input type="hidden" th:field="*{east}">
                <input type="hidden" th:field="*{west}">
                <details class="mt-3" th:open="${search.hasArea()}">
                    <summary class="text-secondary">
                        <span th:text="#{label.search.area}">Map area</span>
                        <span class="badge bg-blue-lt ms-1" th:if="${search.hasArea()}" th:text="#{label.search.areaActive}">active</span>
                    </summary>
                    <div id="search-area-map" class="mt-2 rounded" style="height: 280px;"></div>
                    <div class="d-flex gap-2 mt-2">
                        <button type="button" class="btn btn-outline-primary" id="search-area-use" th:text="#{label.search.useMapArea}">Use visible map area</button>
                        <button type="button" class="btn btn-link" id="search-area-clear" th:if="${search.hasArea()}" th:text="#{label.search.clearArea}">Clear area</button>
                    </div>
                </details>
            </form>
        </div>
    </div>

    <script th:inline="none">
        (() => {
            const form = document.getElementById('search-form');
            const container = document.getElementById('search-area-map');
            if (!form || !container) {
                return;
            }
            const field = (name) => form.querySelector(`input[name="${name}"]`);
            const value = (name) => field(name).value === '' ? null : Number(field(name).value);
            const area = ['north', 'south', 'east', 'west'].map(value);
            let map = null;

            const showMap = () => {
                if (map) {
                    return;
                }
                map = L.map(container).setView([20, 0], 1);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
                if (area.every((v) => v !== null)) {
                    const [north, south, east, west] = area;
                    // An area across the antimeridian is drawn by shifting east by 360°
                    const bounds = [[south, west], [north, west <= east ? east : east + 360]];
                    L.rectangle(bounds, {weight: 2, fill: false}).addTo(map);
                    map.fitBounds(bounds);
                }
            };
            const details = container.closest('details');
            if (details.open) {
                showMap();
            }
            details.addEventListener('toggle', () => {
                if (details.open) {
                    showMap();
                    map.invalidateSize();
                }
            });

            const wrap = (lng) => ((lng + 180) % 360 + 360) % 360 - 180;
            const round = (v) => Math.round(v * 100000) / 100000;
            document.getElementById('search-area-use').addEventListener('click', () => {
                const bounds = map.getBounds();
                const wholeWorld = bounds.getEast() - bounds.getWest() >= 360;
                field('north').value = round(Math.min(bounds.getNorth(), 90));
                field('south').value = round(Math.max(bounds.getSouth(), -90));
                field('west').value = wholeWorld ? -180 : round(wrap(bounds.getWest()));
                field('east').value = wholeWorld ? 180 : round(wrap(bounds.getEast()));
                form.requestSubmit();
            });
            document.getElementById('search-area-clear')?.addEventListener('click', () => {
                ['north', 'south', 'east', 'west'].forEach((name) => { field(name).value = ''; });
                form.requestSubmit();
            });
        })();
    </script>

    <div th:if="${pageData != null}">
        <p class="text-secondary mt-3" th:text="#{label.search.results(${pageData.totalElements})}">3 photos found</p>
        <div th:replace="~{photo/list :: photoCards(${photos}, #{msg.photo.search.empty})}"></div>
    </div>
</div>
</html>
