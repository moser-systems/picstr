<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <title th:text="#{label.photo.archive}">Archived Photos</title>
</head>

<div layout:fragment="content">
    <div class="page-header mt-3">
        <div class="row align-items-center">
            <div class="col">
                <h2 class="page-title" th:text="#{label.photo.archive}">Archived Photos</h2>
            </div>
        </div>
    </div>

    <div class="page-body">
        <th:block th:if="${#lists.isEmpty(photos)}">
            <div th:replace="~{fragments/empty :: emptyState('archive', #{msg.photo.archive.empty}, #{msg.empty.archive}, null, null)}"></div>
        </th:block>

        <div class="card" th:if="${!#lists.isEmpty(photos)}">
            <div class="table-responsive">
                <table class="table table-vcenter table-striped table-hover table-nowrap card-table">
                    <thead>
                    <tr>
                        <th class="w-1"><span class="visually-hidden" th:text="#{label.bulk.select}">Select</span></th>
                        <th th:text="#{label.photo}">Photo</th>
                        <th th:text="#{label.category}">Category</th>
                        <th th:text="#{label.tags}">Tags</th>
                        <th th:text="#{label.photo.uploadedAt}">Uploaded at</th>
                        <th th:text="#{label.photo.deletedAt}">Archived at</th>
                        <th th:text="#{label.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="photo : ${photos}">
                        <td>
                            <input type="checkbox" class="form-check-input m-0 bulk-select" name="ids" form="bulk-form"
                                   th:value="${photo.id}" th:aria-label="|#{label.bulk.select}: ${photo.originalFilename}|">
                        </td>
                        <td>
                            <a th:href="@{|/photos/archive/${photo.id}|}" th:title="${photo.originalFilename}">
                                <img th:if="${photo.processingStatus.name() == 'READY'}" th:src="|/assets/${photo.thumbnailKey}|" th:alt="${photo.originalFilename}" style="max-width: 50px; max-height: 50px;" />
                                <span th:unless="${photo.processingStatus.name() == 'READY'}" class="badge bg-secondary-lt"
                                      th:text="${photo.processingFailed} ? #{label.photo.processingFailed} : #{label.photo.processing}">Processing…</span>
                            </a></td>
                        <td>
                            <a th:href="@{|/categories/${photo.category.id}|}" class="text-decoration-none">
                                <span th:class="|badge bg-${photo.category.color} text-${photo.category.color}-fg|" th:text="${photo.category.name}">category</span>
                            </a>
                        </td>
                        <td>
                            <span th:if="${photo.tags == null or photo.tags.isEmpty()}" th:text="'-'">-</span>
                            <span th:if="${photo.tags != null and !photo.tags.isEmpty()}">
                                <span th:each="tag : ${photo.tags}">
                                    <a th:href="@{|/photos/by-tag/${tag.name}|}" class="text-decoration-none me-1">
                                        <span th:class="|badge bg-${tag.color}-lt text-${tag.color}-lt-fg|" th:text="|#${tag.name}|">tag</span>
                                    </a>
                                </span>
                            </span>
                        </td>
                        <td th:text="${#temporals.format(photo.uploadedAt, 'dd.MM.yyyy HH:mm')}">2026-01-01T00:00:00Z</td>
                        <td th:text="${#temporals.format(photo.deleteDate, 'dd.MM.yyyy HH:mm')}">2026-01-31T00:00:00Z</td>
                        <td>
                            <form th:action="@{|/photos/${photo.id}/restore|}" method="post" class="d-inline">
                                <input type="hidden" name="redirect" value="/photos/archive" />
                                <button type="submit" class="btn btn-sm btn-outline-primary" th:title="#{label.btn.restore}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-restore">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path d="M3.06 13a9 9 0 1 0 .49 -4.087" />
                                        <path d="M3 4.001v5h5" />
                                        <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                                    </svg>
                                    <span th:text="#{label.btn.restore}">Restore</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <form id="bulk-form" class="card position-sticky bottom-0 mt-3 shadow d-none" style="z-index: 3"
              th:if="${!#lists.isEmpty(photos)}" th:action="@{/photos/bulk}" method="post"
              th:attr="data-selected-text=#{label.bulk.selected}">
            <input type="hidden" name="returnTo" th:value="${returnUrl}">
            <div class="card-body d-flex flex-wrap gap-2 align-items-center">
                <strong class="me-1 bulk-count">0</strong>
                <button type="button" class="btn btn-link px-1 bulk-select-all" th:text="#{label.bulk.selectAll}">Select all</button>
                <button type="button" class="btn btn-link px-1 bulk-clear" th:text="#{label.bulk.clear}">Clear</button>
                <button type="submit" name="action" value="restore" class="btn btn-primary" th:text="#{label.bulk.restore}">Restore</button>
            </div>
        </form>

        <div class="mt-3" th:if="${pageData != null and pageData.totalPages > 1}">
            <ul class="pagination m-0">
                <li class="page-item" th:classappend="${pageData.first} ? ' disabled'">
                    <a class="page-link" th:if="${!pageData.first}" th:href="@{/photos/archive(page=${pageData.number - 1},size=${pageSize})}">&laquo;</a>
                    <span class="page-link" th:if="${pageData.first}">&laquo;</span>
                </li>
                <li class="page-item"
                    th:each="pageNumber : ${#numbers.sequence(0, pageData.totalPages - 1)}"
                    th:classappend="${pageNumber == pageData.number} ? ' active'">
                    <a class="page-link" th:href="@{/photos/archive(page=${pageNumber},size=${pageSize})}" th:text="${pageNumber + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${pageData.last} ? ' disabled'">
                    <a class="page-link" th:if="${!pageData.last}" th:href="@{/photos/archive(page=${pageData.number + 1},size=${pageSize})}">&raquo;</a>
                    <span class="page-link" th:if="${pageData.last}">&raquo;</span>
                </li>
            </ul>
        </div>
    </div>
</div>
</html>
