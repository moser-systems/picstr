<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
>
<head><title th:text="#{label.photo.upload}">Upload Photo</title></head>

<div layout:fragment="content">
    <div class="page-header mt-3">
        <div class="row align-items-center">
            <div class="col">
                <h2 class="page-title" th:text="#{label.photo.upload}">Upload Photo</h2>
            </div>
        </div>
    </div>

    <div class="page-body">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/photos/upload}" th:object="${uploadForm}" method="post" enctype="multipart/form-data">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
                    </div>
                    <div class="mb-3" id="image-inputs" th:attr="data-selected-text=#{label.photo.selected}">
                        <span class="form-label" th:text="#{label.photo.images}">Photos</span>
                        <div class="row g-2">
                            <div class="col-sm-6">
                                <label class="btn btn-primary w-100">
                                    <span th:text="#{label.photo.takePhoto}">Take photo</span>
                                    <input type="file" name="images" class="d-none" accept="image/*" capture="environment">
                                </label>
                            </div>
                            <div class="col-sm-6">
                                <label class="btn btn-outline-primary w-100">
                                    <span th:text="#{label.photo.choosePhotos(${T(io.picstr.app.form.UploadForm).MAX_IMAGES})}">Choose photos</span>
                                    <input type="file" name="images" class="d-none" accept="image/*" multiple>
                                </label>
                            </div>
                        </div>
                        <div class="form-text" id="image-selection"></div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('images')}" th:errors="*{images}">Images error</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="category" th:text="#{label.category}">Category</label>
                        <select id="category" class="form-select" th:field="*{category}" required>
                            <option value="" th:text="#{label.category.select}">Select category</option>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${#strings.capitalize(category.name)}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="description" th:text="#{label.description}">Description</label>
                        <textarea id="description"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"
                                  th:field="*{description}"
                                  maxlength="1000"
                                  rows="4"></textarea>
                        <div class="form-text" th:text="#{msg.description.optional}">Optional, up to 1000 characters.</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="tags" th:text="#{label.tags}">Tags</label>
                        <select id="tags" class="form-select" multiple th:field="*{tags}" autocomplete="off">
                            <option th:each="tag : ${allTags}"
                                    th:value="${tag.name}"
                                    th:text="${tag.name}"
                                    th:selected="${uploadForm.tags != null and #lists.contains(uploadForm.tags, tag.name)}"></option>
                        </select>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('tags')}" th:errors="*{tags}">Tags error</div>

                        <div class="form-text" th:text="#{msg.tags.hint}">Select existing tags or type a new one and press Enter.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="latitude" th:text="#{label.latitude}">Latitude</label>
                        <input id="latitude" type="text" class="form-control" th:field="*{latitude}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="longitude" th:text="#{label.longitude}">Longitude</label>
                        <input id="longitude" type="text" class="form-control" th:field="*{longitude}" readonly>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-secondary" onclick="prefillLocation()" th:text="#{label.btn.useLocation}">Use current location</button>
                        <button type="submit" class="btn btn-primary" th:text="#{label.btn.upload}">Upload now</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function prefillLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }
            navigator.geolocation.getCurrentPosition(success, error);
        }
        function success(position) {
            document.getElementById('latitude').value = position.coords.latitude.toFixed(7);
            document.getElementById('longitude').value = position.coords.longitude.toFixed(7);
        }
        function error() {
            alert("Sorry, no position available.");
        }
        new TomSelect('#tags', {
            create: true,
            createOnBlur: true,
            allowEmptyOption: true,
            maxItems: 5,
            plugins: ['remove_button']
        });
    </script>
    <script>
        (() => {
            const container = document.getElementById('image-inputs');
            const selection = document.getElementById('image-selection');
            const inputs = container.querySelectorAll('input[type="file"]');
            const update = () => {
                const files = [...inputs].flatMap((input) => [...input.files]);
                selection.textContent = files.length === 0 ? ''
                    : container.dataset.selectedText.replace('{0}', files.length) + ': '
                        + files.map((file) => file.name).join(', ');
            };
            inputs.forEach((input) => input.addEventListener('change', update));
        })();
    </script>
</div>
</html>
